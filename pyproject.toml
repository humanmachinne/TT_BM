[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tt_bm"
version = "0.1.0"
description = "MPO-based Burer-Monteiro rank-2 SDP/QUBO solver"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Egor Tiunov"},
]
dependencies = [
    "torch>=2.0",
]

[project.urls]
Repository = "https://github.com/humanmachinne/TT_BM"

[tool.setuptools.packages.find]
include = ["tt_bm*"]
